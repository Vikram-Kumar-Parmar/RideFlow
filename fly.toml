app = "rideflow"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_TARGET = "tidb"
  TIDB_PORT = "4000"
  TIDB_DATABASE = "databaseProject_db"
  JWT_EXPIRES_IN = "8h"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
