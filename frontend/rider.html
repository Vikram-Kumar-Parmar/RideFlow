<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rider — RideFlow</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">RideFlow · Rider</div>
    <nav>
      <span class="who" id="who"></span>
      <button class="btn secondary" id="logoutBtn">Sign out</button>
    </nav>
  </header>

  <main>
    <div class="tabs">
      <button data-tab="book" class="active">Book a ride</button>
      <button data-tab="history">Ride history</button>
      <button data-tab="wallet">Wallet</button>
      <button data-tab="ratings">Ratings</button>
    </div>

    <section id="tab-book">
      <div class="card">
        <h2>Book a ride</h2>
        <div id="bookMsg"></div>
        <form id="bookForm" class="row">
          <div style="flex:1; min-width:160px">
            <label>Pickup</label>
            <select name="pickup_loc_id" required></select>
          </div>
          <div style="flex:1; min-width:160px">
            <label>Drop-off</label>
            <select name="dropoff_loc_id" required></select>
          </div>
          <div style="width:130px">
            <label>Vehicle</label>
            <select name="vehicle_type" required>
              <option>ECONOMY</option>
              <option>PREMIUM</option>
              <option>BIKE</option>
            </select>
          </div>
          <div style="width:110px">
            <label>Distance (km)</label>
            <input name="distance_km" type="number" step="0.1" min="0.1" value="5" />
          </div>
          <div style="width:110px">
            <label>Duration (min)</label>
            <input name="duration_min" type="number" min="1" value="15" />
          </div>
          <div style="width:130px">
            <label>Promo code</label>
            <input name="promo_code" placeholder="optional" />
          </div>
          <div style="width:120px">
            <label>Payment</label>
            <select name="payment_method">
              <option>CASH</option><option>WALLET</option><option>CARD</option>
            </select>
          </div>
          <div style="width:90px">
            <label>Peak?</label>
            <select name="is_peak"><option value="false">No</option><option value="true">Yes</option></select>
          </div>
          <div>
            <button class="btn" type="submit">Book</button>
          </div>
        </form>
      </div>
    </section>

    <section id="tab-history" class="hide">
      <div class="card">
        <h2>Your ride history</h2>
        <div id="historyTable"></div>
      </div>
    </section>

    <section id="tab-wallet" class="hide">
      <div class="card">
        <h2>Wallet</h2>
        <p>Current balance: <strong id="walletBal">—</strong></p>
        <form id="topupForm" class="row">
          <div style="width:160px">
            <label>Top-up amount</label>
            <input name="amount" type="number" min="1" step="1" value="500" />
          </div>
          <div><button class="btn" type="submit">Top up</button></div>
        </form>
        <div id="topupMsg"></div>
      </div>
    </section>

    <section id="tab-ratings" class="hide">
      <div class="card">
        <h2>Rate a completed ride</h2>
        <form id="rateForm" class="row">
          <div style="width:140px">
            <label>Ride</label>
            <select name="ride_id" id="rateRide"></select>
          </div>
          <div style="width:90px">
            <label>Score</label>
            <select name="score">
              <option>5</option><option>4</option><option>3</option>
              <option>2</option><option>1</option>
            </select>
          </div>
          <div style="flex:1">
            <label>Comment</label>
            <input name="comment" placeholder="Optional comment…" />
          </div>
          <div><button class="btn" type="submit">Submit</button></div>
        </form>
        <div id="rateMsg"></div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    Developed by Vikram Kumar &middot; Roll 23K-2062 &middot; Section DS-4B
  </footer>

  <script type="module" src="/js/rider.js"></script>
</body>
</html>
