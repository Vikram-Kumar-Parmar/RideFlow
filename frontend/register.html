<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — RideFlow</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="top">
    <div class="brand">RideFlow</div>
    <nav><a href="/login.html" class="btn secondary">Sign in</a></nav>
  </header>

  <main class="center-screen">
    <div class="card auth-card" style="max-width: 480px;">
      <h2>Create account</h2>
      <p style="color: var(--muted); font-size: 14px; margin-bottom: 20px; text-align: center;">Join RideFlow to start
        booking or offering rides.</p>
      <div id="msg"></div>
      <form id="regForm">
        <div class="form-group">
          <label for="full_name">Full name</label>
          <input id="full_name" name="full_name" required placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" required placeholder="john@example.com" />
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" required placeholder="+923001234567" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="6"
            placeholder="At least 6 characters" />
        </div>
        <div class="form-group">
          <label for="role">Select Role</label>
          <select name="role" id="role">
            <option value="RIDER">Rider (Book Rides)</option>
            <option value="DRIVER">Driver (Offer Rides)</option>
          </select>
        </div>
        <div id="driverFields" class="hide"
          style="margin-top: 20px; padding: 18px; background-color: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); transition: all 0.2s ease;">
          <h3
            style="font-family: var(--font-display); font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-dark);">
            Driver Verification</h3>
          <div class="form-group">
            <label for="license_num">License #</label>
            <input id="license_num" name="license_num" placeholder="LIC-XXXX" />
          </div>
          <div class="form-group">
            <label for="cnic">CNIC</label>
            <input id="cnic" name="cnic" placeholder="42101-1234567-1" />
          </div>

          <h3
            style="font-family: var(--font-display); font-size: 14px; font-weight: 700; margin: 18px 0 12px 0; color: var(--text-dark);">
            Vehicle Details</h3>
          <div class="form-row">
            <div class="form-group">
              <label for="vehicle_make">Make</label>
              <input id="vehicle_make" name="vehicle_make" placeholder="Toyota" />
            </div>
            <div class="form-group">
              <label for="vehicle_model">Model</label>
              <input id="vehicle_model" name="vehicle_model" placeholder="Corolla" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 0 0 80px;">
              <label for="vehicle_year">Year</label>
              <input id="vehicle_year" name="vehicle_year" type="number" min="1980" max="2100" placeholder="2022" />
            </div>
            <div class="form-group">
              <label for="vehicle_color">Color</label>
              <input id="vehicle_color" name="vehicle_color" placeholder="White" />
            </div>
            <div class="form-group">
              <label for="license_plate">License plate</label>
              <input id="license_plate" name="license_plate" placeholder="ABC-123" />
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="vehicle_type">Vehicle type</label>
            <select id="vehicle_type" name="vehicle_type">
              <option value="ECONOMY">Economy</option>
              <option value="PREMIUM">Premium</option>
              <option value="BIKE">Bike</option>
            </select>
          </div>
        </div>
        <button class="btn" type="submit" style="width:100%; margin-top: 20px;">Sign up</button>
      </form>
    </div>
  </main>

  <footer class="app-footer">
    Developed by Umar Behram &middot; 23i-2604 &middot; Vikram Kumar &middot; Roll 23K-2062 &middot; Section DS-4B

  </footer>

  <script type="module">
    import { api, setSession } from './js/api.js';
    const role = document.getElementById('role');
    const driverFields = document.getElementById('driverFields');
    role.addEventListener('change', () => {
      driverFields.classList.toggle('hide', role.value !== 'DRIVER');
    });
    const form = document.getElementById('regForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      const fd = new FormData(form);
      const body = Object.fromEntries(fd);
      try {
        const r = await api('/api/auth/register', {
          method: 'POST', body: JSON.stringify(body),
        });
        setSession(r.token, r.user);
        const rl = String(r.user.role).toUpperCase();
        location.href = rl === 'RIDER' ? '/rider.html'
          : rl === 'DRIVER' ? '/driver.html' : '/admin.html';
      } catch (err) {
        msg.innerHTML = `<div class="status-msg err">${err.message}</div>`;
      }
    });
  </script>
</body>

</html>
