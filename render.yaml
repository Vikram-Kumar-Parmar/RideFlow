services:
  - type: web
    name: rideflow
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node backend/server.js
    envVars:
      - key: DB_TARGET
        value: tidb
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        value: 4000
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_DATABASE
        value: databaseProject_db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
